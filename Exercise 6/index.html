<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Responsive D3 Chart</title>
        <link rel="stylesheet" href="css/base.css">
        <link rel="stylesheet" href="css/visualisations.css">
    </head>
    <body>
        <header>
            <h1>Responsive D3 Chart</h1>
        </header>
        <main>
            <div>
                <h1>Energy Consumption for different TV screen types and sizes</h1>
                <p>TV's vary considerably in their energy consumption.</p>
                <!-- div for filter screen -->
                <div id="filter_screen"></div>
                <!-- div for charts -->
                <div id="histogram" class="responsive-svg-container"></div>
                <div id="scatterplot" class="responsive-svg-container"></div>

                <div class="body">
                    <h3>Data source</h3>
                    <p>
                        <a href="https://data.gov.au/data/dataset/559708e5-480e-4f94-8429-c49571e82761/resource/93a615e5-935e-4713-a4b0-379e3f6dedc9/download/tv_2026_05_21.csv">
                            Energy Rating Data for household appliances - Televisions
                        </a><br>
                    </p>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Data Visualization Week 8. All rights reserved.</p>
        </footer>
        
        <script src="https://d3js.org/d3.v7.min.js"></script>
        <script src="js/shared-constants.js"></script>
        <script src="js/histogram.js"></script>
        <script src="js/scatter-plot.js"></script>
        <script src="js/interactions.js"></script>
        <script src="js/load-data.js"></script>
    </body>
</html>
